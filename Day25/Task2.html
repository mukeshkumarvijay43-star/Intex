<!DOCTYPE html>
<html>
<head>
    <title>Fetch Posts API</title>
</head>
<body>

<script>
fetch("https://jsonplaceholder.typicode.com/posts")
    .then(response => response.json())
    .then(posts => {
        console.log(posts);
    })
    .catch(error => {
        console.error("Error:", error);
    });
</script>

</body>
</html>
