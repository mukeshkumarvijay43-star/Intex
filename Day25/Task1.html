<!DOCTYPE html>
<html>
<head>
    <title>Fetch Users API</title>
</head>
<body>

<script>
fetch("https://jsonplaceholder.typicode.com/users")
    .then(response => response.json())
    .then(users => {
        console.log(users);
    })
    .catch(error => {
        console.error("Error:", error);
    });
</script>

</body>
</html>
