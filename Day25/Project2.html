<!DOCTYPE html>
<html>
<head>
    <title>Post Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .post {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .post h3 {
            margin: 0 0 10px;
        }
    </style>
</head>
<body>

    <h2>Post Viewer</h2>

    <div id="postList"></div>

    <script>
        async function fetchPosts() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/posts");
                const posts = await response.json();

                const postList = document.getElementById("postList");

                posts.forEach(post => {
                    postList.innerHTML += `
                        <div class="post">
                            <h3>${post.title}</h3>
                            <p>${post.body}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.log("Error:", error);
            }
        }

        fetchPosts();
    </script>

</body>
</html>
